<style>
:root{
  --bg:#eef0f8; --panel:#ffffff; --ink:#1b2138; --muted:#6b7390; --faint:#9aa1bd;
  --line:#e4e7f2; --line-soft:#eef0f8;
  --accent:#6366f1; --accent2:#8b5cf6; --accent-ink:#4f46e5;
  --chip:#eef0fe; --chip-ink:#4f46e5;
  --stage:#dfe2ef; --shadow:24px 40px 90px -50px rgba(38,43,84,.55);
  --frame:#f4f5fb;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0e1c; --panel:#14172c; --ink:#eef0fb; --muted:#9aa1c4; --faint:#6a719a;
  --line:#262a47; --line-soft:#1c2039; --chip:#20244a; --chip-ink:#c3c8ff;
  --stage:#0a0c18; --shadow:24px 40px 100px -50px rgba(0,0,0,.75); --frame:#1b1f3a;
}}
:root[data-theme="light"]{
  --bg:#eef0f8; --panel:#ffffff; --ink:#1b2138; --muted:#6b7390; --faint:#9aa1bd;
  --line:#e4e7f2; --line-soft:#eef0f8; --chip:#eef0fe; --chip-ink:#4f46e5;
  --stage:#dfe2ef; --shadow:24px 40px 90px -50px rgba(38,43,84,.55); --frame:#f4f5fb;
}
:root[data-theme="dark"]{
  --bg:#0c0e1c; --panel:#14172c; --ink:#eef0fb; --muted:#9aa1c4; --faint:#6a719a;
  --line:#262a47; --line-soft:#1c2039; --chip:#20244a; --chip-ink:#c3c8ff;
  --stage:#0a0c18; --shadow:24px 40px 100px -50px rgba(0,0,0,.75); --frame:#1b1f3a;
}
*{box-sizing:border-box}
.gw{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:
    radial-gradient(60vw 40vw at 82% -8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
    radial-gradient(50vw 40vw at 0% 108%, color-mix(in srgb, var(--accent2) 20%, transparent), transparent 55%),
    var(--bg);
  min-height:100vh; padding:clamp(14px,3vw,34px);
  display:flex; flex-direction:column; align-items:center; gap:18px;
}
.gw-top{width:100%; max-width:1080px; display:flex; align-items:center; justify-content:space-between; gap:16px}
.brand{display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:-.02em}
.brand .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 20px -8px var(--accent)}
.brand .mark svg{width:19px;height:19px}
.brand small{display:block; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.themebtn{border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:10px;
  width:38px;height:38px; cursor:pointer; display:grid; place-items:center}
.themebtn:hover{color:var(--ink)}

.stage-wrap{width:100%; max-width:1080px; display:grid; grid-template-columns:1.35fr .95fr; gap:18px}
@media (max-width:900px){.stage-wrap{grid-template-columns:1fr}}

.stage{background:var(--stage); border:1px solid var(--line); border-radius:20px; padding:clamp(10px,1.6vw,20px);
  overflow:hidden; position:relative; min-height:280px; display:grid}
.frame{border-radius:12px; overflow:hidden; box-shadow:var(--shadow); background:var(--frame); align-self:center; width:100%}
.frame .bar{display:flex; align-items:center; gap:7px; padding:9px 12px; background:var(--frame); border-bottom:1px solid var(--line)}
.frame .dot{width:10px;height:10px;border-radius:50%}
.frame .u{margin-left:10px; flex:1; font-size:11px; color:var(--muted); background:color-mix(in srgb,var(--stage) 60%, transparent);
  border-radius:7px; padding:4px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-variant-numeric:tabular-nums}
.frame .shot{display:block; width:100%; height:auto}
.kb{animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}

.title-card{align-self:center; text-align:center; padding:clamp(20px,4vw,50px) 24px}
.title-card .big{width:74px;height:74px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 20px 46px -18px var(--accent)}
.title-card .big svg{width:38px;height:38px}
.title-card h2{font-size:clamp(24px,3.6vw,38px); margin:0; letter-spacing:-.03em; text-wrap:balance; font-weight:800}
.title-card p{color:var(--muted); max-width:52ch; margin:12px auto 0; line-height:1.5}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:clamp(18px,2vw,26px);
  display:flex; flex-direction:column; gap:14px}
.chip{align-self:flex-start; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--chip-ink); background:var(--chip); padding:5px 11px; border-radius:999px}
.panel h1{font-size:clamp(19px,2.2vw,25px); margin:0; letter-spacing:-.02em; text-wrap:balance; line-height:1.2}
.lead{color:var(--ink); font-weight:500; line-height:1.5; margin:0}
.pts{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
.pts li{position:relative; padding-left:22px; color:var(--muted); line-height:1.5; font-size:14.5px}
.pts li::before{content:""; position:absolute; left:2px; top:8px; width:8px; height:8px; border-radius:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent2))}
.pts li b{color:var(--ink)}
.count{margin-top:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; letter-spacing:.04em}

.controls{width:100%; max-width:1080px; display:flex; flex-direction:column; gap:12px}
.bar-prog{height:5px; border-radius:999px; background:var(--line); overflow:hidden}
.bar-prog i{display:block; height:100%; width:0; border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
.transport{display:flex; align-items:center; justify-content:center; gap:10px}
.tbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; cursor:pointer;
  height:44px; padding:0 16px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:8px}
.tbtn:hover{border-color:var(--accent)}
.tbtn svg{width:17px;height:17px}
.tbtn.play{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; width:54px; justify-content:center; padding:0}
.tbtn:focus-visible,.themebtn:focus-visible,.seg:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tbtn[disabled]{opacity:.4; cursor:default}

.chapters{width:100%; max-width:1080px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding-top:4px}
.seg{border:1px solid var(--line); background:transparent; border-radius:999px; height:8px; width:30px; cursor:pointer; padding:0}
.seg[data-on="1"]{background:linear-gradient(90deg,var(--accent),var(--accent2)); border-color:transparent}
.seg:hover{border-color:var(--accent)}
.menu{width:100%; max-width:1080px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px}
.menu button{text-align:left; border:1px solid var(--line); background:var(--panel); color:var(--muted);
  border-radius:11px; padding:9px 12px; cursor:pointer; font-size:12.5px; font-weight:600; display:flex; gap:8px; align-items:center}
.menu button:hover{color:var(--ink); border-color:var(--accent)}
.menu button[data-on="1"]{color:var(--accent-ink); border-color:var(--accent); background:var(--chip)}
.menu .n{font-variant-numeric:tabular-nums; color:var(--faint); font-size:11px}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.kb{animation:none}.fade{animation:none}}
</style>

<div class="gw" id="gw">
  <div class="gw-top">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2 2 6 2s6-1 6-2v-5"/></svg></span>

    </button>

  <div class="stage-wrap">

    </div>
    <div class="chapters" id="segs"></div>
  </div>

  <div class="menu" id="menu"></div>
</div>

const $ = (id) => document.getElementById(id);
let idx = 0, playing = true, t0 = 0, raf = 0;

const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const CAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2 2 6 2s6-1 6-2v-5"/></svg>';

function renderStage(s){
  const stage = $("stage");
  if(!s.img){
    stage.innerHTML = '<div class="title-card fade"><div class="big">'+CAP+'</div><h2>'+s.title+'</h2><p>'+s.lead+'</p></div>';
  } else {
    stage.innerHTML =
      '<div class="frame fade">'+
        '<div class="bar"><span class="dot" style="background:#f87171"></span><span class="dot" style="background:#fbbf24"></span><span class="dot" style="background:#34d399"></span>'+
        '<span class="u">'+(s.url||"")+'</span></div>'+
        '<img class="shot kb" alt="'+s.title+'" src="'+s.img+'">'+
      '</div>';
  }
}
function renderPanel(s){
  $("panel").innerHTML =
    '<span class="chip">'+s.role+'</span>'+
    '<h1 class="fade">'+s.title+'</h1>'+
    '<p class="lead">'+s.lead+'</p>'+
    '<ul class="pts">'+s.points.map(p=>'<li>'+p+'</li>').join("")+'</ul>'+
    '<div class="count">Chapter '+(idx+1)+' of '+SCENES.length+'</div>';
}
function renderSegs(){
  $("segs").innerHTML = SCENES.map((s,i)=>'<button class="seg" data-on="'+(i<=idx?1:0)+'" aria-label="Chapter '+(i+1)+': '+s.title+'" onclick="go('+i+')"></button>').join("");
}
function renderMenu(){
  $("menu").innerHTML = SCENES.map((s,i)=>'<button data-on="'+(i===idx?1:0)+'" onclick="go('+i+')"><span class="n">'+String(i+1).padStart(2,"0")+'</span>'+s.title+'</button>').join("");
}
function paint(){
  const s = SCENES[idx];
  renderStage(s); renderPanel(s); renderSegs(); renderMenu();
  $("prev").disabled = idx===0;
  $("play").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  t0 = performance.now();
}
function tick(now){
  if(playing){
    const p = Math.min(1,(now-t0)/DURATION);
    $("prog").style.width = (p*100)+"%";
    if(p>=1){ idx = (idx+1)%SCENES.length; paint(); }
  }
  raf = requestAnimationFrame(tick);
}
window.go = (i)=>{ idx=(i+SCENES.length)%SCENES.length; paint(); };
$("next").onclick = ()=> go(idx+1);
$("prev").onclick = ()=> go(idx-1);
$("play").onclick = ()=>{ playing=!playing; $("play").innerHTML = playing?ICON_PAUSE:ICON_PLAY; t0=performance.now(); if(!playing) $("prog").style.width="0"; };
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") go(idx+1);
  else if(e.key==="ArrowLeft") go(idx-1);
  else if(e.key===" "){ e.preventDefault(); $("play").click(); }
});
// theme toggle
const root = document.documentElement;
$("theme").onclick = ()=>{
  const cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  root.setAttribute("data-theme", cur==="dark"?"light":"dark");
};
if(matchMedia("(prefers-reduced-motion:reduce)").matches){ playing=false; }
paint();
raf = requestAnimationFrame(tick);
</script>
